<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Aniket Badakh · Software Engineer</title>
    <meta
      name="description"
      content="Aniket Badakh, software engineer building production web applications with Node.js, TypeScript, React, SQL and AWS."
    />
    <meta property="og:title" content="Aniket Badakh · Software Engineer" />
    <meta
      property="og:description"
      content="Backend and full-stack engineer: event-driven AWS services, secure APIs, payments, and production web apps."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#100F14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F6FA" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
